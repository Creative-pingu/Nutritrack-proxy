<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>NutriTrack</title>
    <style>
        /* Ensure the app takes up the full mobile viewport */
        html, body { 
            margin: 0; 
            padding: 0;
            background: #0a0f1a; 
            color: white; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        #root { height: 100%; width: 100%; }
        #loading-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            font-size: 14px;
        }
    </style>

    <!-- Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.344.0"></script>

    <script>
        // Global Shims for the original JSX
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;
        window.useCallback = React.useCallback;
        window.useRef = React.useRef;
        
        if (window.lucide) {
            Object.assign(window, window.lucide);
            window['lucide-react'] = window.lucide;
        }

        window.storage = {
            get: async (k) => ({ value: localStorage.getItem(k) }),
            set: async (k, v) => { localStorage.setItem(k, v); return v; },
            delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
        };
    </script>
</head>
<body>
    <div id="root">
        <div id="loading-screen">Launching NutriTrack...</div>
    </div>

    <script type="text/babel">
        async function loadApp() {
            try {
                // Fetch the original JSX file
                const res = await fetch('./NutriTrack.jsx?v=' + Date.now());
                let code = await res.text();

                // Automagically adapt the file for the browser environment
                code = code.replace(/import\s+[\s\S]+?from\s+['"].+?['"];/g, '// Stripped Import');
                code = code.replace(/export\s+default/g, 'window._MainApp = ');

                // Transform JSX to JS
                const transformed = Babel.transform(code, { 
                    presets: ['react', ['env', { modules: false }]] 
                }).code;

                eval(transformed);

                // Render the app
                const App = window._MainApp || (typeof NutriTrack !== 'undefined' ? NutriTrack : null);
                
                if (App) {
                    const root = ReactDOM.createRoot(document.getElementById("root"));
                    root.render(React.createElement(App));
                } else {
                    document.getElementById('root').innerHTML = '<div style="padding:20px; color:red;">Error: NutriTrack component not found.</div>';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('root').innerHTML = `<div style="padding:20px; color:red;">Crash: ${e.message}</div>`;
            }
        }
        loadApp();
    </script>
</body>
</html>
