<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack (test)</title>
    <style>
        [span_6](start_span)/*[span_6](end_span) Sets dark background + safe-area meta tags to look right on iPhone */
        html, body { 
            margin: 0; 
            background: #0a0f1a; 
            color: #e2e8f0;
            font-family: 'DM Sans', system-ui, sans-serif; 
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18",
            "react-dom": "https://esm.sh/react-dom@18",
            "react-dom/client": "https://esm.sh/react-dom@18/client",

        }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        /**
         * [span_7](start_span) window.storage shim to mimic Claude runtime using localStorage.
         * Match the contract exactly as the JSX expects[span_7](end_span).
         */
        window.storage = {
            get: async (key) => {
                const v = localStorage.getItem(key);
                return v !== null ? { value: v } : null;
            },
            set: async (key, value) => {
                localStorage.setItem(key, value);
                return value;
            },
            delete: async (key) => {
                localStorage.removeItem(key);
                return { deleted: true };
            }
        };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react,env">
        import React from "react";
        import { createRoot } from "react-dom/client";
        import NutriTrack from "./NutriTrack.jsx";

        createRoot(document.getElementById("root")).render(<NutriTrack />);
    </script>
</body>
</html>
