<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack Test</title>
    <style>
        html, body { margin: 0; background: #0a0f1a; color: white; height: 100%; font-family: sans-serif; }
        #root { padding: 20px; }
    </style>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // window.storage shim
        window.storage = {
            get: async (k) => ({ value: localStorage.getItem(k) }),
            set: async (k, v) => { localStorage.setItem(k, v); return v; },
            delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
        };
        
        // Mock the "lucide-react" imports that the JSX expects
        // This maps the icons used in the app to the global Lucide library
        window['lucide-react'] = window.lucide;
    </script>
</head>
<body>
    <div id="root">If you see this, the app is still loading or Babel is processing...</div>

    <script type="text/babel" data-presets="react,env" src="./NutriTrack.jsx"></script>

    <script type="text/babel" data-presets="react,env">
        // This second script waits for the first one to finish
        window.addEventListener('load', () => {
            if (window.NutriTrack) {
                const root = ReactDOM.createRoot(document.getElementById("root"));
                root.render(<window.NutriTrack />);
            }
        });
    </script>
</body>
</html>
