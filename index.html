<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack Test</title>
    <style>
        html, body { margin: 0; background: #0a0f1a; color: white; height: 100%; overflow-x: hidden; }
        #root { height: 100%; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18",
            "react-dom": "https://esm.sh/react-dom@18",
            "react-dom/client": "https://esm.sh/react-dom@18/client",
            "lucide-react": "https://esm.sh/lucide-react"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        window.storage = {
            get: async (k) => ({ value: localStorage.getItem(k) }),
            set: async (k, v) => { localStorage.setItem(k, v); return v; },
            delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
        };
    </script>
</head>
<body>
    <div id="root">Loading NutriTrack...</div>
    <script type="text/babel" data-presets="react,env">
        import React from "react";
        import { createRoot } from "react-dom/client";

        async function init() {
            try {
                // Fetch the JSX code directly
                const response = await fetch('./NutriTrack.jsx');
                const code = await response.text();
                
                // Transform and execute the code. 
                // This makes 'NutriTrack' available in this scope.
                const transformed = Babel.transform(code, { 
                    presets: ['react', 'env'] 
                }).code;
                
                // Execute the code to define the component
                eval(transformed);

                // Render it (NutriTrack is now defined by the eval)
                const root = createRoot(document.getElementById("root"));
                root.render(<NutriTrack />);
            } catch (e) {
                alert("Harness Error: " + e.message);
            }
        }

        init();
    </script>
</body>
</html>
