<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack Debug</title>
    <script>
        // Catch early load errors and show them as a popup on your iPad
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            alert("Error: " + msg + "\nScript: " + url + "\nLine: " + lineNo);
            return false;
        };
    </script>
    <style>
        html, body { margin: 0; background: #0a0f1a; color: white; height: 100%; }
        #root { height: 100%; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18",
            "react-dom": "https://esm.sh/react-dom@18",
            "react-dom/client": "https://esm.sh/react-dom@18/client",
            "lucide-react": "https://esm.sh/lucide-react"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">Loading NutriTrack... (If this stays, check alerts)</div>
    <script type="text/babel" data-type="module" data-presets="react,env">
        import React from "react";
        import { createRoot } from "react-dom/client";
        import NutriTrack from "./NutriTrack.jsx";

        try {
            const root = createRoot(document.getElementById("root"));
            root.render(<NutriTrack />);
        } catch (e) {
            alert("Render Error: " + e.message);
        }
    </script>
</body>
</html>
