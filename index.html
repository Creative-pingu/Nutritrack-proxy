<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack Test</title>
    <style>
        html, body { margin: 0; background: #0a0f1a; color: white; height: 100vh; font-family: sans-serif; }
        #root { height: 100%; }
        #loader { padding: 20px; color: #64748b; font-size: 14px; font-family: monospace; }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Storage Shim
        window.storage = {
            get: async (k) => ({ value: localStorage.getItem(k) }),
            set: async (k, v) => { localStorage.setItem(k, v); return v; },
            delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
        };
        // Mock lucide-react for the JSX logic
        window['lucide-react'] = window.lucide;
    </script>
</head>
<body>
    <div id="root"><div id="loader">Syncing with GitHub...</div></div>

    <script type="text/babel" data-presets="react,env">
        async function startApp() {
            const loader = document.getElementById('loader');
            try {
                const response = await fetch('./NutriTrack.jsx?v=' + Date.now());
                let code = await response.text();

                // iPhone Fix: Comment out the import lines so Babel doesn't trip
                code = code.replace(/import/g, '// import');

                // Transform and Define
                const transformed = Babel.transform(code, { presets: ['react', 'env'] }).code;
                eval(transformed);

                // Render
                const root = ReactDOM.createRoot(document.getElementById("root"));
                root.render(<NutriTrack />);
            } catch (e) {
                loader.innerHTML = '<span style="color:red">Error: ' + e.message + '</span>';
            }
        }
        startApp();
    </script>
</body>
</html>
