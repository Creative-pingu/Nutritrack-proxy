<script>
    window.storage = {
        get: async (k) => { return { value: localStorage.getItem(k) }; },
        set: async (k, v) => { localStorage.setItem(k, v); return v; },
        delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
    };

    // Inject React hooks globally so the stripped JSX can find them
    if (window.React) {
        const hooks = ['useState', 'useEffect', 'useRef', 'useCallback', 'useMemo'];
        hooks.forEach(hook => window[hook] = window.React[hook]);
    }
    
    // Inject Lucide icons globally
    if (window.lucide) { 
        Object.assign(window, window.lucide); 
        window['lucide-react'] = window.lucide; 
    }
</script>
